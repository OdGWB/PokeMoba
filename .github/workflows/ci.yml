# CI: i test su ogni Pull Request verso main (e su ogni push su main), PRIMA del merge.
# Non crea exe ne' Release: quella e' release.yml, che parte solo con una voce nuova in
# data/news.json o a mano.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un nuovo push sulla stessa PR annulla il giro di test vecchio.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONUTF8: "1"
      POKEMOBA_NO_UPDATE: "1"
      RUST_VERSION: "1.100.0"   # la stessa in release.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Motore Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:RUSTUP_TOOLCHAIN = $env:RUST_VERSION
          python tools/build_native.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test
        run: python -m pytest -q

      # Il gioco pubblicato gira sul Rust: una regola cambiata solo in Python
      # darebbe un gioco diverso. Stesse partite nei due motori, tick per tick.
      - name: Parita' Python / Rust
        run: python tools/rust_parity.py --jobs 2 --secs 30
