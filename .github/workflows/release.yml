# GitHub Release "v<build>" (nome "PokéMoba 3.0.N") con PokeMoba-Setup.exe (da scaricare)
# e PokeMoba.exe allegati. Gli exe gia' installati vedono la Release all'avvio
# (game/updater.py) e si aggiornano da soli scaricando PokeMoba.exe.
#
# NON parte a ogni merge: solo quando su main arriva una modifica a data/news.json con
# in cima una versione NON ancora pubblicata (o a mano, da Actions -> Release -> Run
# workflow). La versione 3.0.N della voce decide build e tag (tools/release_info.py).
# Correggere il testo di una voce gia' pubblicata non rifa' la Release. Per ripubblicare
# la stessa versione (asset dimenticato) si aggiunge una build a REBUILDS in game/version.py.
# I test delle PR sono in ci.yml.
name: Release

on:
  push:
    branches: [main]
    paths: [data/news.json, game/version.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      build: ${{ steps.info.outputs.build }}
      tag: ${{ steps.info.outputs.tag }}
      new: ${{ steps.tag.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Versione dalle novita'
        id: info
        run: python tools/release_info.py --github

      - name: Gia' pubblicata?
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.info.outputs.tag }}" > /dev/null; then
            echo "Il tag ${{ steps.info.outputs.tag }} esiste gia': nessuna Release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: windows-latest
    # Il secret UPDATE_SIGNING_KEY sta nell'environment "release", che GitHub
    # concede solo ai workflow del branch main: un workflow su un altro branch non
    # puo' leggere la chiave della firma.
    environment: release
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONUTF8: "1"
      BUILD: ${{ needs.check.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Test
        run: python -m pytest -q -x

      - name: Note della Release
        run: python tools/release_info.py --notes

      - name: Numero di versione
        shell: python
        run: |
          import os, re, pathlib
          p = pathlib.Path("game/version.py")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r"^BUILD = \d+", f"BUILD = {os.environ['BUILD']}", s, flags=re.M)
          s = re.sub(r'^REPO = ".*?"', f'REPO = "{os.environ["GITHUB_REPOSITORY"]}"', s, flags=re.M)
          p.write_text(s, encoding="utf-8")
          print(s)
          ns = {}
          exec(s, ns)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              print(f"VERSION_NAME={ns['name']()}", file=fh)

      - name: Exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name PokeMoba
          --icon assets/ui/icon.ico
          --add-data "assets;assets"
          --add-data "data;data"
          --collect-submodules game --collect-submodules engine
          --collect-submodules net --collect-submodules sim
          --collect-all aiortc
          --distpath dist --workpath build/pyinstaller
          run_client.py

      # Installer (Inno Setup 6) che mette PokeMoba.exe in %LOCALAPPDATA%\Programs\PokeMoba
      # con menu Start, icona sul desktop e disinstallazione. PokeMoba.exe resta allegato
      # anche da solo: e' quello che scarica l'aggiornamento automatico.
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          & $iscc "/DAppVersion=$env:VERSION_NAME" installer\PokeMoba.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Firma Ed25519 dell'exe (tools/release_sign.py): gli exe con UPDATE_PUBKEY in
      # game/version.py installano un aggiornamento SOLO se la firma e' valida. Se la
      # chiave pubblica c'e' ma il secret manca, si ferma tutto: una Release non
      # firmata verrebbe rifiutata da tutti gli exe installati.
      - name: Firma dell'exe
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        shell: python
        run: |
          import os, subprocess, sys
          sys.path.insert(0, ".")
          from game import version
          if os.environ.get("UPDATE_SIGNING_KEY"):
              subprocess.run([sys.executable, "tools/release_sign.py", "sign",
                              "dist/PokeMoba.exe"], check=True)
              if version.UPDATE_PUBKEY:
                  subprocess.run([sys.executable, "tools/release_sign.py", "verify",
                                  "dist/PokeMoba.exe"], check=True)
          elif version.UPDATE_PUBKEY:
              sys.exit("UPDATE_PUBKEY impostata ma manca il secret UPDATE_SIGNING_KEY")
          else:
              print("Firma non configurata (UPDATE_PUBKEY vuota): Release non firmata.")

      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: PokéMoba ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: |
            dist/PokeMoba-Setup.exe
            dist/PokeMoba.exe
            dist/PokeMoba.exe.sig
          make_latest: true
