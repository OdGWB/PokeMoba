# Ogni push sul ramo main: test, exe Windows con PyInstaller, installer (Inno Setup) e nuova
# GitHub Release "v<numero build>" (nome "PokéMoba 3.0.N", vedi game/version.py) con
# PokeMoba-Setup.exe (da scaricare) e PokeMoba.exe allegati. Gli exe gia' installati vedono
# la Release all'avvio (game/updater.py) e si aggiornano da soli scaricando PokeMoba.exe.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONUTF8: "1"
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Test
        run: python -m pytest -q -x

      - name: Numero di versione
        shell: python
        run: |
          import os, re, pathlib
          p = pathlib.Path("game/version.py")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r"^BUILD = \d+", f"BUILD = {os.environ['BUILD']}", s, flags=re.M)
          s = re.sub(r'^REPO = ".*?"', f'REPO = "{os.environ["GITHUB_REPOSITORY"]}"', s, flags=re.M)
          p.write_text(s, encoding="utf-8")
          print(s)
          ns = {}
          exec(s, ns)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              print(f"VERSION_NAME={ns['name']()}", file=fh)

      - name: Exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name PokeMoba
          --icon assets/ui/icon.ico
          --add-data "assets;assets"
          --add-data "data;data"
          --collect-submodules game --collect-submodules engine
          --collect-submodules net --collect-submodules sim
          --collect-all aiortc
          --distpath dist --workpath build/pyinstaller
          run_client.py

      # Installer (Inno Setup 6) che mette PokeMoba.exe in %LOCALAPPDATA%\Programs\PokeMoba
      # con menu Start, icona sul desktop e disinstallazione. PokeMoba.exe resta allegato
      # anche da solo: e' quello che scarica l'aggiornamento automatico.
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          & $iscc "/DAppVersion=$env:VERSION_NAME" installer\PokeMoba.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: PokéMoba ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          body: |
            ${{ github.event.head_commit.message }}

            **Download:** scarica ed esegui **PokeMoba-Setup.exe**. Chi ha già il gioco
            riceve l'aggiornamento da solo all'avvio.

            <sub>PokeMoba.exe è il file usato dall'aggiornamento automatico.</sub>
          files: |
            dist/PokeMoba-Setup.exe
            dist/PokeMoba.exe
          make_latest: true
