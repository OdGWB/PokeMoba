# GitHub Release "v<build>" (nome "PokéMoba 3.1.N", le ricostruzioni "3.1.N (build B)") con PokeMoba-Setup.exe (da scaricare)
# e PokeMoba.exe allegati. Gli exe gia' installati vedono la Release all'avvio
# (game/updater.py) e si aggiornano da soli scaricando PokeMoba.exe.
#
# NON parte a ogni merge: solo quando su main arriva una modifica a data/news.json con
# in cima una versione NON ancora pubblicata (o a mano, da Actions -> Release -> Run
# workflow). La versione 3.0.N della voce decide build e tag (tools/release_info.py).
# Correggere il testo di una voce gia' pubblicata non rifa' la Release. Per ripubblicare
# la stessa versione (asset dimenticato) si aggiunge una build a REBUILDS in game/version.py.
# I test delle PR sono in ci.yml.
name: Release

on:
  push:
    branches: [main]
    paths: [data/news.json, game/version.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      build: ${{ steps.info.outputs.build }}
      tag: ${{ steps.info.outputs.tag }}
      new: ${{ steps.tag.outputs.new }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Versione dalle novita'
        id: info
        run: python tools/release_info.py --github

      - name: Gia' pubblicata?
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.info.outputs.tag }}" > /dev/null; then
            echo "Il tag ${{ steps.info.outputs.tag }} esiste gia': nessuna Release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: windows-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONUTF8: "1"
      BUILD: ${{ needs.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Test
        run: python -m pytest -q -x

      - name: Note della Release
        run: python tools/release_info.py --notes

      - name: Numero di versione
        shell: python
        run: |
          import os, re, pathlib
          p = pathlib.Path("game/version.py")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r"^BUILD = \d+", f"BUILD = {os.environ['BUILD']}", s, flags=re.M)
          s = re.sub(r'^REPO = ".*?"', f'REPO = "{os.environ["GITHUB_REPOSITORY"]}"', s, flags=re.M)
          p.write_text(s, encoding="utf-8")
          print(s)
          ns = {}
          exec(s, ns)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              print(f"VERSION_NAME={ns['name']()}", file=fh)
              print(f"RELEASE_NAME={ns['release_name_of'](ns['BUILD'])}", file=fh)

      - name: Exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name PokeMoba
          --icon assets/ui/icon.ico
          --add-data "assets;assets"
          --add-data "data;data"
          --collect-submodules game --collect-submodules engine
          --collect-submodules net --collect-submodules sim
          --collect-all aiortc
          --distpath dist --workpath build/pyinstaller
          run_client.py

      # Installer (Inno Setup 6) che mette PokeMoba.exe in %LOCALAPPDATA%\Programs\PokeMoba
      # con menu Start, icona sul desktop e disinstallazione. PokeMoba.exe resta allegato
      # anche da solo: e' quello che scarica l'aggiornamento automatico.
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          & $iscc "/DAppVersion=$env:VERSION_NAME" installer\PokeMoba.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: PokéMoba ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: |
            dist/PokeMoba-Setup.exe
            dist/PokeMoba.exe
          make_latest: true
